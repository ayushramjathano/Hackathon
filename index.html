<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>log in basic</title>
</head>

<body>
  <h1>Register / Login (API test)</h1>

  <!-- Basic form for signing in and stuff-->
  <label>Email <input id="email" type="email" /></label><br />
  <label>Password <input id="password" type="password" /></label><br />
  <label>First name <input id="firstName" /></label><br />
  <label>Last name <input id="lastName" /></label><br />
  <label>Role
    <select id="role">
      <option value="student">student</option>
      <option value="employer">employer</option>
    </select>
  </label><br /><br />

  <button id="registerBtn">Register</button>
  <button id="loginBtn">Login</button>
  <button id="meBtn">Me</button>

  <script src="functions.js"></script>
  <script>

    //this functions returns all the values from the form, can be done in other ways
function formBody() {
      return {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        first_name: document.getElementById('firstName').value,
        last_name: document.getElementById('lastName').value,
        role: document.getElementById('role').value,
      };
    }

    // the async means that it works in the background so the website does freeze while it waits for the backend to repsond
    document.getElementById('registerBtn').onclick = async () => {
      const { email, password, first_name, last_name, role } = formBody();
      try {
        const data = await register(email, password, first_name, last_name, role);
        console.log('registered ok', data)
      } catch (err) {
        console.error(err)
      }
    };

    document.getElementById('loginBtn').onclick = async () => {
      const { email, password } = formBody();
      try {
        const data = await login(email, password); // two args
        console.log('login ok', data);
      } catch (err) {
        console.error(err);
      }
    };

    document.getElementById('meBtn').onclick = async () => {
      const token = localStorage.getItem('access_token');
      if (!token) {
        show('No token yet — register or login first');
        return;
      }
      const res = await fetch(API + '/api/me', {
        headers: { Authorization: 'Bearer ' + token },
      });
      //   const data = await res.json();
      //   show({ status: res.status, data });
    };
  </script>
</body>

</html>
