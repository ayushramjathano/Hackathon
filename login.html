<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Nexora.AI Register / Log in</title>
  <link rel="stylesheet" href="Stylingsheet.css">
</head>

<body>
  <h1 class="index">Register / Login </h1>
  <div class="nav-links">

    <a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="login.html">Sign Up|Login</a>
<a href="Students.html">Our students</a>
<a href="createJobListing.html">Create Job Listings</a>
<a href="addStudentInfo.html">Profile</a>
<a href="listings.html">All Job Listings</a>
<a href="reccomendedJobs.html">AI reccomended jobs</a>
  </div>

  <div class="forms">
    <h1>Register</h1>
    <label>Email <input id="email" type="email" /></label><br />
    <label>Password <input id="password" type="password" /></label><br />
    <label>First name <input id="firstName" /></label><br />
    <label>Last name <input id="lastName" /></label><br />
    <label>Role
      <select id="role">
        <option value="student">student</option>
        <option value="employer">employer</option>
      </select>
    </label><br /><br />
    <button id="registerBtn">Register</button>
  </div>
  <div class="forms">
    <h1>Login</h1>
    <label>Email <input id="email-login" type="email" /></label><br />
    <label>Password <input id="password-login" type="password" /></label><br />
    </label><br /><br />
    <button id="loginBtn">Login</button>
  </div>
  

  <pre id="out"></pre>

  <script src="functions.js"></script>
  <script>
    const out = document.getElementById('out');

    function formBody() {
      return {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        first_name: document.getElementById('firstName').value,
        last_name: document.getElementById('lastName').value,
        role: document.getElementById('role').value,
      };
    }

    document.getElementById('registerBtn').onclick = async () => {
      const { email, password, first_name, last_name, role } = formBody();
      try {
        const data = await register(email, password, first_name, last_name, role);
        alert("Registered an account successfully");
        // out.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        // out.textContent = err.message;
        alert("Error registering Account, " + err.message);
        console.error(err);
      }
    };

    document.getElementById('loginBtn').onclick = async () => {
      const email = document.getElementById('email-login').value;
      const password = document.getElementById('password-login').value;
      try {
        const data = await login(email, password);
        // out.textContent = JSON.stringify(data, null, 2);
        alert("Login was succesful");
      } catch (err) {
        // out.textContent = err.message;
        console.error(err);
        alert("Error logging in, " + err.message);
      }
    };
  </script>
</body>

</html>
