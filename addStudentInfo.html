<div class="forms">
    <h1>Add profile info</h1>
    <h6>Things marked with '*' are required  once added the info cannot be changed so be careful</h6>
    <label>Skills*<input  id="skills" type="text" /></label><br />
    <label>Project Descriptions*<input id="project" type="text" /></label><br />
   
   <br/><br/>
    <button id="submitBtn">Add Student Info</button>
  </div>

  <script src="functions.js"></script>
  <script>

    document.getElementById('submitBtn').onclick = async () => {
      const skills_raw_input = document.getElementById('skills').value;
      const project_description = document.getElementById('project').value;
      try {
        const data = await addStudentInfo(skills_raw_input, project_description);
        // out.textContent = JSON.stringify(data, null, 2);
        alert("Student info was added succesfully")
      } catch (err) {
        // out.textContent = err.message;
        alert("There wan an error adding the info, " + err.message);
        console.error(err);
      }
    };

  </script>
